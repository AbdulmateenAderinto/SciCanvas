<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SciCanvas</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; worker-src blob:">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">SciCanvas<span id="docname">Untitled</span></div>
    <div class="tb-group">
      <button data-cmd="home" title="Home & recent figures (⇧⌘H)">Home</button>
      <button data-cmd="new" title="New figure (⌘N)">New</button>
      <button data-cmd="open" title="Open (⌘O)">Open</button>
      <button data-cmd="save" title="Save (⌘S)">Save</button>
      <button data-cmd="export" class="primary" title="Export (⌘E)">Export</button>
    </div>
    <div class="tb-group">
      <button data-cmd="undo" title="Undo (⌘Z)">Undo</button>
      <button data-cmd="redo" title="Redo (⇧⌘Z)">Redo</button>
    </div>
    <div class="tb-group">
      <button data-cmd="templates">Templates</button>
      <button data-cmd="protocol">Protocol</button>
      <button data-cmd="graph">Graph</button>
      <button data-cmd="chem">Chemistry</button>
      <button data-cmd="pdb" title="Protein structure from the PDB">Protein</button>
      <button data-cmd="importImage">Image</button>
    </div>
    <div class="tb-group">
      <button id="aiMenuBtn" class="ai" title="AI tools — plan, generate, restyle, edit">✦ AI</button>
    </div>
    <div class="tb-group right">
      <button data-cmd="copyImage" title="Copy selection / page as image (⇧⌘C)">Copy</button>
      <button data-cmd="help" title="Help (F1)">?</button>
      <button data-cmd="settings" title="Settings (⌘,)">⚙</button>
      <button data-cmd="present" title="Present (⌘↵)">▶ Present</button>
    </div>
  </header>

  <div id="main">
    <aside id="left">
      <div class="tabs"><button class="tab active" data-ltab="library">Library</button><button class="tab" data-ltab="uploads">Uploads</button></div>
      <div id="lib-library" class="lpane">
        <div class="searchrow"><input id="search" type="search" placeholder="Search ~21,700 icons (antibody, neuron, stroke, X-ray…)" /><button id="smartBtn" title="Smart search — describe what you need in plain words (uses AI)">✦</button></div>
        <div id="smartNote" class="note hidden"></div>
        <div id="cats"><button data-cat="All">All</button><button data-cat="★ Favorites">★</button><button data-cat="Recent">Recent</button><button data-cat="Soft style" title="Soft-style proteins, complexes and cells">Soft</button><button data-cat="Suggested" title="Icons related to what's in your figure">For you</button><select id="catSel"></select></div>
        <div id="libBanner" class="hidden"></div>
        <div id="icongrid"></div>
        <div id="libfoot"></div>
      </div>
      <div id="lib-uploads" class="lpane hidden">
        <button id="uploadBtn" class="wide">Upload PNG / JPG / SVG…</button>
        <div id="uploadgrid"></div>
        <div class="hint">Images you import are kept with this figure. You can also drop or paste images onto the canvas.</div>
      </div>
    </aside>

    <section id="center">
      <div id="tools">
        <button data-tool="select" title="Select (V)" class="active"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
        <button data-tool="pan" title="Pan (H or hold Space)"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3" fill="none"/></svg></button>
        <span class="sep"></span>
        <button data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v15" fill="none" stroke-width="2.5"/></svg></button>
        <button data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" fill="none"/></svg></button>
        <button data-tool="ellipse" title="Ellipse (E)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6" fill="none"/></svg></button>
        <button data-tool="shape" title="Shapes (S) — triangle, diamond, hexagon, arrow…"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z" fill="none"/></svg></button>
        <button data-tool="badge" title="Numbered badge (N) — click to place the next number"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><text x="12" y="16" text-anchor="middle" font-size="11" font-family="Helvetica" fill="#fff" stroke="none" font-weight="700">1</text></svg></button>
        <span class="sep"></span>
        <button data-tool="pencil" title="Pencil (D) — freehand; end near the start for a filled shape"><svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z" fill="none"/><path d="M14 6l4 4" fill="none"/></svg></button>
        <button data-tool="pen" title="Pen (P) — click for corners, drag for curves"><svg viewBox="0 0 24 24"><path d="M12 3l6 9-6 9-6-9z" fill="none"/><circle cx="12" cy="12" r="1.6"/></svg></button>
        <button data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5" fill="none" stroke-width="2"/></svg></button>
        <button data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 19L18 6M18 6h-7M18 6v7" fill="none" stroke-width="2"/></svg></button>
        <button data-tool="airbrush" title="Shading airbrush (W) — paint soft shadows / highlights"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" opacity=".25"/><circle cx="12" cy="12" r="4" opacity=".45"/></svg></button>
 <button data-tool="eraser" title="Eraser (X) — erase parts of an object (non-destructive)"><svg viewBox="0 0 24 24"><path d="M4 16l8-9 7 6-6 7H8z" fill="none"/><path d="M8 20h12" fill="none"/></svg></button>
        <button data-tool="table" title="Table — click to place"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5" fill="none"/><path d="M3 10h18M3 14.5h18M9 5v14M15 5v14" fill="none"/></svg></button>
        <span class="sep"></span>
        <button data-tool="connector" title="Connector (C) — drag from one object to another; drop on a side dot to pin to that side"><svg viewBox="0 0 24 24"><path d="M4 18L18 6M18 6h-6M18 6v6" fill="none"/></svg></button>
        <span class="sep"></span>
        <button data-tool="brush" data-kind="membrane" title="Membrane brush (B)"><svg viewBox="0 0 24 24"><path d="M3 9q9-5 18 0M3 15q9-5 18 0" fill="none"/><circle cx="6" cy="7.5" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="18" cy="7.5" r="1.4"/></svg></button>
        <button data-tool="brush" data-kind="dna" title="DNA brush"><svg viewBox="0 0 24 24"><path d="M4 4c8 4 8 12 16 16M20 4C12 8 12 16 4 20M8 7h8M8 17h8" fill="none"/></svg></button>
        <button data-tool="brush" data-kind="actin" title="Actin filament brush"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.4"/><circle cx="9.5" cy="10" r="2.4"/><circle cx="14" cy="12" r="2.4"/><circle cx="18.5" cy="10" r="2.4"/></svg></button>
        <button data-tool="brush" data-kind="epithelium" title="Epithelium / cell layer brush"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="5" height="10" fill="none"/><rect x="9.5" y="7" width="5" height="10" fill="none"/><rect x="16" y="7" width="5" height="10" fill="none"/></svg></button>
        <button data-tool="brush" data-kind="ubiquitin" title="Ubiquitin / bead chain brush"><svg viewBox="0 0 24 24"><circle cx="5" cy="14" r="3"/><circle cx="10.5" cy="11" r="3"/><circle cx="16" cy="13" r="3"/><circle cx="20.5" cy="9.5" r="2.4"/></svg></button>
        <button data-tool="brush" data-kind="vesicles" title="Vesicle brush"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="3" fill="none"/><circle cx="13" cy="10" r="2.5" fill="none"/><circle cx="19" cy="13" r="2.5" fill="none"/></svg></button>
        <span class="sep"></span>
        <button data-tool="comment" title="Comment (M) — pin feedback to the figure"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none"/></svg></button>
        <div id="drawOpts" class="hidden">
          <input id="drawColor" type="color" title="Stroke / shading colour">
          <label id="drawFillWrap" title="Fill for closed shapes"><input id="drawFill" type="color"></label>
          <input id="drawWidth" type="range" min="0.5" max="20" step="0.5" title="Width">
          <select id="drawMode" title="Pencil mode"><option value="free">Freehand</option><option value="shape">Custom shape</option><option value="protein">Soft protein</option></select>
          <div id="drawHint"></div>
        </div>
        <div id="shapePick" class="hidden"><select id="shapeKind" title="Shape"></select></div>
        <div id="brushShape" class="hidden">
          <select id="brushMode" title="Brush path">
            <option value="free">Freehand</option>
            <option value="line">Line</option>
            <option value="arc">Arc</option>
            <option value="ellipse">Ellipse (closed)</option>
          </select>
        </div>
      </div>
      <div id="stage">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="gridpat" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dfe4ea" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern>
            <filter id="cvd-prot"><feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/></filter>
            <filter id="cvd-deut"><feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/></filter>
            <filter id="cvd-trit"><feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0"/></filter>
            <filter id="pageShadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity=".15"/></filter>
          </defs>
          <g id="viewport">
            <rect id="pagebg" filter="url(#pageShadow)"/>
            <rect id="gridrect" fill="url(#gridpat)" pointer-events="none"/>
            <g id="scene"></g>
            <g id="userguides"></g>
            <g id="guides"></g>
            <g id="overlay"></g>
            <g id="commentlayer"></g>
          </g>
        </svg>
        <textarea id="textEditor" class="hidden" spellcheck="true"></textarea>
        <canvas id="rulerTop" class="ruler hidden"></canvas>
        <canvas id="rulerLeft" class="ruler hidden"></canvas>
        <div id="rulerCorner" class="hidden"></div>
        <div id="ctxbar" class="hidden"></div>
        <div id="visionChip" class="hidden"></div>
        <div id="changedBanner" class="hidden"></div>
        <div id="alignpop" class="hidden"></div>
      </div>
      <footer id="pagesbar">
        <div id="pages"></div>
        <button id="addPage" title="Add page / slide">＋ Page</button>
        <button data-cmd="slideSorter" title="Slide sorter & speaker notes">▦ Slides</button>
        <div class="spacer"></div>
        <span id="status"></span>
        <button data-cmd="zoomOut">−</button><span id="zoomLabel">100%</span><button data-cmd="zoomIn">＋</button><button data-cmd="zoomFit">Fit</button>
      </footer>
    </section>

    <aside id="right">
      <div class="tabs"><button class="tab active" data-rtab="props">Properties</button><button class="tab" data-rtab="layers">Layers</button><button class="tab" data-rtab="comments">Comments</button></div>
      <div id="props" class="rpane"></div>
      <div id="layers" class="rpane hidden"></div>
      <div id="comments" class="rpane hidden"></div>
    </aside>
  </div>

  <div id="modal" class="hidden"><div class="dialog"><div class="dlg-head"><h2 id="modalTitle"></h2><button id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
  <div id="present" class="hidden"><div id="presentStage"></div><div id="presentHint">← → to navigate · Esc to exit</div></div>
  <div id="toast" class="hidden"></div>
  <div id="pop" class="hidden"></div>

  <script src="../node_modules/3dmol/build/3Dmol-min.js"></script>
  <script src="../node_modules/pptxgenjs/dist/pptxgen.bundle.js"></script>
  <script src="../node_modules/jszip/dist/jszip.min.js"></script>
  <script src="../node_modules/smiles-drawer/dist/smiles-drawer.min.js"></script>
  <script src="../node_modules/pako/dist/pako.min.js"></script>
  <script src="../node_modules/utif/UTIF.js"></script>
  <script src="../node_modules/polygon-clipping/dist/polygon-clipping.umd.min.js"></script>
  <script src="icons.js"></script>
  <script src="softicons.js"></script>
  <script src="softicons2.js"></script>
  <script src="softicons3.js"></script>
  <script src="softicons4.js"></script>
  <script src="softicons5.js"></script>
  <script src="immunoicons.js"></script>
  <script src="graph.js"></script>
  <script src="render.js"></script>
  <script src="richtext.js"></script>
  <script src="draw.js"></script>
  <script src="packs.js"></script>
  <script src="model.js"></script>
  <script src="graph2.js"></script>
  <script src="stats3.js"></script>
  <script src="app.js"></script>
  <script src="arrange.js"></script>
  <script src="more.js"></script>
  <script src="dialogs.js"></script>
  <script src="pptxexport.js"></script>
  <script src="creator.js"></script>
  <script src="ai.js"></script>
  <script src="aidocs.js"></script>
  <script src="files.js"></script>
  <script src="bio.js"></script>
  <script src="immuno.js"></script>
  <script src="immunotemplates.js"></script>
  <script src="data.js"></script>
  <script src="omics.js"></script>
  <script src="statcharts.js"></script>
  <script src="microscopy.js"></script>
  <script src="shapeops.js"></script>
  <script src="molbio.js"></script>
  <script src="diagrams.js"></script>
  <script src="templates2.js"></script>
  <script src="journal.js"></script>
  <script src="extras.js"></script>
  <script src="design.js"></script>
  <script src="design2.js"></script>
  <script src="design3.js"></script>
  <script src="biorender.js"></script>
</body>
</html>
